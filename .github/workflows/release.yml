name: release

# Push a tag such as v0.1.0 to publish the macOS binaries and the Claude
# Desktop extension (.mcpb) as a GitHub release. The binaries are signed with
# a Developer ID certificate and notarized by Apple; see
# whatsapp-go/RELEASING.md for the repository secrets this needs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: whatsapp-go
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-go/go.mod
          cache-dependency-path: whatsapp-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go vet ./... && go test ./...

      - name: Import the Developer ID certificate and the notary key
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for v in P12_BASE64 P12_PASSWORD API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::missing repository secret for $v; see whatsapp-go/RELEASING.md"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::the certificate in MACOS_SIGN_P12_BASE64 is not a Developer ID Application certificate"
            exit 1
          fi
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$API_ISSUER_ID"
            echo "RELEASE_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          REQUIRE_NOTARIZATION: '1'
        run: bash ./scripts/build-release.sh "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

      - name: Remove the keychain and the key
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
