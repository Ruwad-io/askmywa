name: release

# Push a tag such as v0.1.0 to publish the binaries, the Claude Desktop
# extension (.mcpb), the installer and the Homebrew formula as a GitHub
# release. The macOS binaries are signed with a Developer ID certificate and
# notarized by Apple; see whatsapp-go/RELEASING.md for the repository secrets
# this needs.
#
# A tag with a suffix, such as v0.1.0-rc1, publishes a pre-release for
# testing: signed but not notarized, and ignored by /releases/latest, the
# installer and Homebrew.
#
# The Windows programs are code-signed with Azure Artifact Signing once the
# repository variable AZURE_SIGNING_ACCOUNT is set (see RELEASING.md). Until
# then they ship unsigned, as before. Once it is set, a signing failure stops
# the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    # Microsoft's signing action runs only on Windows.
    if: vars.AZURE_SIGNING_ACCOUNT != ''
    runs-on: windows-latest
    # The Azure app registration trusts this environment (its federated
    # credential), so no Azure password or key is stored in GitHub.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-go/go.mod
          cache-dependency-path: whatsapp-go/go.sum
      - name: Build
        shell: bash
        run: bash whatsapp-go/scripts/build-windows.sh "$TAG" windows-signed
      # The app registration only holds the signer role on the signing
      # account, not on a subscription.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows-signed
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: askmywa
          description-url: https://askmywa.com
          # Sign as the app registration that azure/login signed in with.
          exclude-environment-credential: true
      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem windows-signed -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              Write-Output "::error::$($f.Name) is not validly signed and timestamped: $($sig.Status) $($sig.StatusMessage)"
              exit 1
            }
            Write-Output "$($f.Name): $($sig.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: windows-signed/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: windows
    # Runs after the Windows job, or without it when signing is not set up.
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: whatsapp-go
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-go/go.mod
          cache-dependency-path: whatsapp-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go vet ./... && go test ./...

      - name: Import the Developer ID certificate and the notary key
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for v in P12_BASE64 P12_PASSWORD API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::missing repository secret for $v; see whatsapp-go/RELEASING.md"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::the certificate in MACOS_SIGN_P12_BASE64 is not a Developer ID Application certificate"
            exit 1
          fi
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$API_ISSUER_ID"
            echo "RELEASE_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: windows-signed
          path: ${{ runner.temp }}/windows-signed

      - name: Build, sign and notarize
        env:
          SIGNED_WINDOWS: ${{ needs.windows.result == 'success' && format('{0}/windows-signed', runner.temp) || '' }}
        run: |
          if [ -n "$SIGNED_WINDOWS" ]; then
            export WINDOWS_BIN_DIR="$SIGNED_WINDOWS"
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "pre-release: signed, not notarized"
            unset NOTARY_KEY_PATH NOTARY_KEY_ID NOTARY_ISSUER_ID
            export REQUIRE_NOTARIZATION=0
          else
            export REQUIRE_NOTARIZATION=1
          fi
          bash ./scripts/build-release.sh "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes come from release-notes/X.Y.Z.md when it exists.
          base="${TAG#v}"
          base="${base%%-*}"
          notes="$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
            printf '%s\n\n' "> Pre-release for testing. The macOS binaries are signed but not notarized, so macOS may block them when opened from a browser download." > "$notes"
          else
            : > "$notes"
          fi
          if [ -f "release-notes/$base.md" ]; then
            cat "release-notes/$base.md" >> "$notes"
            flags+=(--notes-file "$notes")
          elif [[ "$TAG" == *-* ]]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" "${flags[@]}"
          fi

      - name: Remove the keychain and the key
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
