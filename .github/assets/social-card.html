<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>askmywa social card</title>
<!-- Serve the repository root, open this file with ?lang=en or ?lang=fr,
     and capture at 1200 × 630 into site/assets/og-{en,fr}.jpg. -->
<style>
@font-face { font-family: Bricolage; src: url('../../site/assets/fonts/bricolage.woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
@font-face { font-family: Atkinson; src: url('../../site/assets/fonts/atkinson.woff2'); }
* { box-sizing: border-box; }
body { position: relative; width: 1200px; height: 630px; margin: 0; padding: 50px 64px; background: #efeaff; color: #1b1240; font: 24px/1.35 Atkinson, sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
.logo { display: flex; align-items: center; gap: 12px; font: 800 34px Bricolage, sans-serif; letter-spacing: -1px; }
.logo img { width: 42px; height: 42px; }
.apps { font-size: 20px; color: #5b34f2; font-weight: 700; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
h1 { font: 800 78px/.98 Bricolage, sans-serif; font-stretch: 78%; letter-spacing: -3px; margin: 0; }
mark { display: inline-block; margin-top: 8px; padding: 0 8px 8px; background: #ffd43b; color: #1b1240; }
.answer { background: #ffd43b; border: 3px solid #1b1240; border-radius: 24px 24px 24px 6px; padding: 26px; box-shadow: 8px 8px 0 #1b1240; transform: rotate(-1.5deg); }
.label { font: 700 16px Atkinson, sans-serif; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 18px; }
.answer h2 { font: 800 30px/1.1 Bricolage, sans-serif; margin: 0 0 20px; }
.answer p:last-child { margin: 0; }
footer { position: absolute; left: 64px; right: 64px; bottom: 50px; border-top: 2px solid #d9d0fb; padding-top: 20px; color: #5e5583; font-size: 21px; }
footer b { color: #1b1240; }
</style>
</head>
<body>
<header>
  <div class="logo"><img src="../../site/assets/favicon.svg" alt="">askmywa</div>
  <div class="apps">Claude · ChatGPT · Codex</div>
</header>
<main>
  <h1 id="title">Ask your<br>WhatsApp<br><mark>anything.</mark></h1>
  <div class="answer">
    <p class="label" id="label">Illustrated example · fictional messages</p>
    <h2 id="answer">The elevator gets fixed Thursday.</h2>
    <p id="details">→ 9 am to noon<br>→ Sophie has the keys<br>→ Invoice expected in December</p>
  </div>
</main>
<footer id="privacy"><b>Local archive.</b> Messages your AI looks up are sent to its provider.</footer>
<script>
if (new URLSearchParams(location.search).get('lang') === 'fr') {
  document.documentElement.lang = 'fr';
  document.getElementById('title').innerHTML = 'Demandez<br>tout à votre<br><mark>WhatsApp.</mark>';
  document.getElementById('label').textContent = 'Exemple illustré · messages fictifs';
  document.getElementById('answer').textContent = "L’ascenseur est réparé jeudi.";
  document.getElementById('details').innerHTML = '→ De 9 h à midi<br>→ Sophie a les clés<br>→ Facture prévue en décembre';
  document.getElementById('privacy').innerHTML = '<b>Archive locale.</b> Les messages consultés sont transmis au fournisseur de l’IA.';
}
</script>
</body>
</html>
